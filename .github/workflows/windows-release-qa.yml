name: Windows release QA

on:
  workflow_dispatch:
  push:
    branches: [release/windows-20261104]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CODESHIFT_QA_TIMEOUT_MS: '600000'
      CODESHIFT_STEAM_APP_ID: '5441360'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix desktop
      - name: Install the pinned Electron runtime for native automation
        run: |
          node desktop/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path desktop/node_modules/electron/dist/electron.exe)) { throw 'Pinned Electron executable is missing' }
      - name: Full quality gate including real Windows junction fixtures
        run: pnpm verify
      - name: Audit production dependencies
        run: |
          pnpm audit --prod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --prefix desktop
      - name: Build renderer from this exact commit
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          pnpm desktop:build
      - name: Install isolated QA tooling
        shell: pwsh
        run: |
          npm install --prefix output/qa-tools --no-save --no-package-lock playwright-core@1.62.0
          node output/qa-tools/node_modules/playwright-core/cli.js install chromium
          "PLAYWRIGHT_PACKAGE=$env:GITHUB_WORKSPACE/output/qa-tools/node_modules/playwright-core" >> $env:GITHUB_ENV
      - name: Package and launch isolated QA build
        run: |
          node desktop/scripts/package.mjs --qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-launch.mjs "$env:GITHUB_WORKSPACE/desktop/release/CODE-SHIFT-QA-win32-x64/CODE-SHIFT.exe"
      - name: Native terminal input
        id: terminal
        continue-on-error: true
        env:
          DEBUG: pw:browser
          ELECTRON_ENABLE_LOGGING: '1'
        run: node tests/e2e/terminal-editing-native.cjs
      - name: Native context menus and clipboard IPC
        id: context
        continue-on-error: true
        run: |
          node tests/e2e/context-menu-seed.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/e2e/context-menu-native.cjs
      - name: Native campaign and save lifecycle
        id: campaign
        continue-on-error: true
        run: node tests/e2e/native.cjs
      - name: Native studio and portable export
        id: studio
        continue-on-error: true
        run: node tests/e2e/full-studio-native.cjs
      - name: Authored websites and webapps in all three languages
        id: authored
        continue-on-error: true
        run: node tests/e2e/authored-project-native.cjs
      - name: Require every native suite before creating a distribution candidate
        if: always()
        env:
          NATIVE_RESULTS: '${{ steps.terminal.outcome }},${{ steps.context.outcome }},${{ steps.campaign.outcome }},${{ steps.studio.outcome }},${{ steps.authored.outcome }}'
        run: |
          $results = $env:NATIVE_RESULTS.Split(',')
          if ($results.Count -ne 5 -or ($results | Where-Object { $_ -ne 'success' })) { throw "Native verification incomplete: $env:NATIVE_RESULTS" }
          node scripts/verify-native-evidence.mjs
      - name: Package Steam candidate without uploading
        run: node desktop/scripts/package.mjs --steam
      - name: Archive candidate and record source
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Localhost-Hero-Windows-5441361.zip'
          Compress-Archive -Path desktop/release/CODE-SHIFT-win32-x64/* -DestinationPath $zip
          @{commit=$env:GITHUB_SHA;buildRun=$env:GITHUB_RUN_ID;sha256=(Get-FileHash $zip -Algorithm SHA256).Hash;steamUploaded=$false} | ConvertTo-Json | Set-Content candidate-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Steam-candidate
          path: |
            Localhost-Hero-Windows-5441361.zip
            candidate-receipt.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-QA-evidence
          path: |
            output/quality-gate/
            output/full-version-quality/*.json
            output/context-menu-qa/*report.json
            output/steam-qa/*.json
            output/steam-qa/*.png
            output/authored-project-native/**/*.json
            output/authored-project-native/**/*.png
            output/authored-project-native/**/video/*.webm
          if-no-files-found: warn
          retention-days: 14
