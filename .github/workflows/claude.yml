# Claude Code on GitHub — Anthropic Console 프로모션 크레딧(API 키)으로 과금됩니다.
# 사용법: Issue / PR 댓글에 "@claude 할 일" 을 쓰면 실행됩니다.
# 크레딧 보호: 저장소 소유자·협업자만 호출 가능, 턴·시간 제한, 동시 실행 1개.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (pnpm via corepack)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Console 크레딧 조직에서 발급한 API 키 (Settings → Secrets → Actions)
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 모델은 저장소 변수 CLAUDE_MODEL 로 지정 (비우면 기본 모델)
          claude_args: >-
            --max-turns 30
            ${{ vars.CLAUDE_MODEL && format('--model {0}', vars.CLAUDE_MODEL) || '' }}
            --allowedTools "Bash(pnpm:*),Bash(node:*),Bash(git:*),Bash(ls:*),Bash(cat:*)"
